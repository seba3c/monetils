[tox]
envlist = py311,py312,py313,coverage,no-pydantic
requires = tox-uv>=1

[testenv]
extras = test
commands = pytest {posargs}

[testenv:coverage]
commands = pytest --cov=monetils --cov-report=term-missing {posargs}

[testenv:no-pydantic]
description = Proves `import monetils` and all direct (non-Pydantic) usage work with zero third-party runtime dependencies installed (FR-010).
extras =
deps = pytest>=8.0
commands = pytest tests/ --ignore=tests/test_pydantic.py {posargs}

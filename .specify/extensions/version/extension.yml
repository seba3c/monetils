schema_version: "1.0"

extension:
  id: version
  name: "Version Bump Workflow"
  version: "1.0.0"
  description: "Interactively bump the project version across all sync points after implementation"
  author: spec-kit-core
  repository: https://github.com/github/spec-kit
  license: MIT

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: uv
      required: false

provides:
  commands:
    - name: speckit.version.bump
      file: commands/speckit.version.bump.md
      description: "Interactively bump the project's version across all sync points"

  config:
    - name: "version-config.yml"
      template: "config-template.yml"
      description: "Version bump configuration"
      required: false

hooks:
  after_implement:
    command: speckit.version.bump
    optional: false
    description: "Bump project version across sync points after implementation"

tags:
  - "version"
  - "release"
  - "workflow"

config:
  defaults:
    auto_bump:
      default: false
      after_implement:
        enabled: true
    run_uv_lock: true
